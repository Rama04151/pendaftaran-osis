<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pendaftaran Calon OSIS | SMAN 3 Tebas</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #064e3b);
            padding: 25px 15px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: auto;
            background: white;
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,.3);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            color: #064e3b;
            font-size: 23px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-top: 7px;
            line-height: 1.5;
        }

        .section {
            margin-top: 22px;
        }

        .section-title {
            color: #047857;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            border-left: 4px solid #10b981;
            padding-left: 10px;
        }

        label {
            display: block;
            color: #334155;
            font-size: 14px;
            font-weight: bold;
            margin: 13px 0 6px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16,185,129,.12);
        }

        .agreement {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            margin-top: 15px;
            font-size: 13px;
            color: #475569;
            line-height: 1.5;
        }

        .agreement input {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            flex-shrink: 0;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 15px;
            margin-top: 24px;
            background: #059669;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #047857;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .status {
            display: none;
            text-align: center;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .footer {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 22px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">🗳️</div>

        <h1>PENDAFTARAN CALON OSIS</h1>

        <div class="subtitle">
            SMA Negeri 3 Tebas<br>
            Tahun Pelajaran 2026/2027
        </div>
    </div>

    <form id="formPendaftaran">

        <!-- KETUA -->
        <div class="section">
            <div class="section-title">👤 Data Ketua</div>

            <label>Nama Ketua</label>
            <input
                type="text"
                id="namaKetua"
                placeholder="Masukkan nama lengkap"
                required
            >

            <label>Kelas Ketua</label>
            <select id="kelasKetua" required>
                <option value="">-- Pilih Kelas --</option>
                <option>X A</option>
                <option>X B</option>
                <option>XI A</option>
                <option>XI B</option>
            </select>

            <label>Nomor WhatsApp Ketua</label>
            <input
                type="tel"
                id="waKetua"
                placeholder="08xxxxxxxxxx"
                required
            >
        </div>

        <!-- WAKIL -->
        <div class="section">
            <div class="section-title">👥 Data Wakil Ketua</div>

            <label>Nama Wakil</label>
            <input
                type="text"
                id="namaWakil"
                placeholder="Masukkan nama lengkap"
                required
            >

            <label>Kelas Wakil</label>
            <select id="kelasWakil" required>
                <option value="">-- Pilih Kelas --</option>
                <option>X A</option>
                <option>X B</option>
                <option>XI A</option>
                <option>XI B</option>
            </select>

            <label>Nomor WhatsApp Wakil</label>
            <input
                type="tel"
                id="waWakil"
                placeholder="08xxxxxxxxxx"
                required
            >
        </div>

        <!-- PERNYATAAN -->
        <div class="section">
            <div class="section-title">📋 Pernyataan Kesediaan</div>

            <label class="agreement">
                <input type="checkbox" id="pernyataan" required>

                <span>
                    Kami menyatakan bersedia mencalonkan diri sebagai
                    Ketua dan Wakil Ketua OSIS SMA Negeri 3 Tebas
                    Tahun Pelajaran 2026/2027 serta siap mengikuti
                    seluruh rangkaian proses pemilihan sesuai dengan
                    ketentuan yang berlaku.
                </span>
            </label>
        </div>

        <button type="submit" id="submitBtn">
            DAFTAR SEKARANG
        </button>

        <div id="status" class="status"></div>

    </form>

    <div class="footer">
        © 2026 OSIS SMANTI TEBAS
    </div>

</div>

<script>
const form = document.getElementById("formPendaftaran");
const button = document.getElementById("submitBtn");
const statusBox = document.getElementById("status");

form.addEventListener("submit", async function(e) {

    e.preventDefault();

    button.disabled = true;
    button.textContent = "MENGIRIM...";
    statusBox.className = "status";
    statusBox.textContent = "";

    const data = {
        namaKetua: document.getElementById("namaKetua").value.trim(),
        kelasKetua: document.getElementById("kelasKetua").value,
        waKetua: document.getElementById("waKetua").value.trim(),

        namaWakil: document.getElementById("namaWakil").value.trim(),
        kelasWakil: document.getElementById("kelasWakil").value,
        waWakil: document.getElementById("waWakil").value.trim(),

        pernyataan: document.getElementById("pernyataan").checked
    };

    try {

        const response = await fetch("/.netlify/functions/daftar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.message || "Gagal mengirim pendaftaran.");
        }

        statusBox.className = "status success";
        statusBox.textContent =
            "✅ Pendaftaran berhasil dikirim. Silakan tunggu informasi selanjutnya.";

        form.reset();

    } catch (error) {

        statusBox.className = "status error";
        statusBox.textContent =
            "❌ " + error.message;

    } finally {

        button.disabled = false;
        button.textContent = "DAFTAR SEKARANG";
    }
});
</script>

</body>
</html>
